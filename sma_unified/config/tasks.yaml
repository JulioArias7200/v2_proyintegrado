# ============================================================================
# DEFINICIÓN DE TAREAS — SMA CONGRESO (CrewAI & YAML Architecture)
# ============================================================================

tareas:
  # ========== TAREA 1: CONCENTRAR OBSERVACIONES ==========
  Concentrar_Observaciones:
    descripcion: >
      Integrar observaciones de múltiples agentes (Constitucional,
      Consistencia, Comisión Legislativa) en un expediente consolidado.
      Cada observación debe mantener trazabilidad de origen.
    agente: "Concentrador"
    expected_output: >
      JSON con expediente consolidado y trazabilidad de origen.
      Estructura:
      {
        "expediente_consolidado": {
          "resumen_ejecutivo": "string",
          "observaciones_integradas": [
            {
              "tipo": "CONSTITUCIONAL|CONSISTENCIA|COMISION",
              "agente_origen": "string",
              "contenido": "string",
              "riesgo": "BAJO|MEDIO|ALTO|CRÍTICO",
              "articulos_afectados": ["string"]
            }
          ],
          "estado_siguiente": "LISTO_PARA_DEBATE"
        }
      }
    herramientas: []
    depends_on:
      - "Auditar_Constitucionalidad"
      - "Analizar_Consistencia"
      - "Asignar_Comision"

  # ========== TAREA 2: REGISTRAR DEBATE ==========
  Registrar_Debate:
    descripcion: >
      Capturar estructura del debate legislativo en secuencia temporal.
      Registrar intervenciones de legisladores, votaciones nominales,
      acuerdos y mociones. Verificar cruzadamente cada evento.
    agente: "Secretario_Camara"
    expected_output: >
      JSON con acta estructurada.
      Estructura:
      {
        "acta_debate": {
          "fecha": "YYYY-MM-DD",
          "sesion_numero": 12,
          "intervenciones": [
            {
              "orden": 1,
              "legislador": "string",
              "partido": "string",
              "contenido": "string",
              "timestamp": "HH:MM"
            }
          ],
          "votaciones": [
            {
              "articulo": 5,
              "votacion": "APROBADO|RECHAZADO|ABSTENIDO",
              "favor": 65,
              "contra": 30,
              "abstenciones": 5
            }
          ],
          "acuerdos": ["string"]
        }
      }
    herramientas: []

  # ========== TAREA 3: GESTIONAR TRÁMITE BICAMERAL ==========
  Gestionar_Bicameral:
    descripcion: >
      Gestionar trámite bicameral: comparar versiones original y retornada,
      clasificar cambios como MAYORES o MENORES, decidir ruta:
      SANCION_DIRECTA o CONFERENCIA_BICAMERAL.
    agente: "Bicameral"
    expected_output: >
      JSON con decisión bicameral.
      Estructura:
      {
        "ciclo_bicameral": {
          "proyecto_id": "string",
          "version_original": {"articulos": []},
          "version_retornada": {"articulos": []},
          "cambios_detectados": [
            {
              "tipo": "MODIFICACION|ELIMINACION|ADICION",
              "articulo": 5,
              "descripcion": "string"
            }
          ],
          "clasificacion_cambios": "MAYORES|MENORES",
          "ruta_siguiente": "SANCION_DIRECTA|CONFERENCIA_BICAMERAL"
        }
      }
    herramientas: []

  # ========== TAREA 4: EVALUAR VETO/PROMULGACIÓN ==========
  Evaluar_Veto_Promulgacion:
    descripcion: >
      Evaluación estratégica multicriterio del proyecto sancionado.
      Analizar viabilidad política, legalidad constitucional,
      factibilidad técnica y sostenibilidad fiscal.
      Decidir: PROMULGAR, VETAR_TOTAL, VETAR_PARCIAL.
    agente: "Veto_Promulgacion"
    expected_output: >
      JSON con decisión ejecutiva.
      Estructura:
      {
        "evaluacion_veto": {
          "proyecto_id": "string",
          "decision": "PROMULGAR|VETAR_TOTAL|VETAR_PARCIAL",
          "criterios": {
            "viabilidad_politica": {"score": 8, "razon": "string"},
            "legalidad_constitucional": {"score": 9, "razon": "string"},
            "factibilidad_tecnica": {"score": 7, "razon": "string"},
            "sostenibilidad_fiscal": {"score": 6, "razon": "string"}
          },
          "score_final": 7.5,
          "observaciones_parciales": ["string"],
          "justificacion": "string"
        }
      }
    herramientas: []
    depends_on:
      - "Gestionar_Bicameral"

  # ========== TAREA 5: PUBLICAR LEY OFICIAL ==========
  Publicar_Ley_Oficial:
    descripcion: >
      Asignar número de ley secuencial, establecer fecha de vigencia,
      formatear para Boletín Oficial, integrar a base normativa.
    agente: "Publicacion_Oficial"
    expected_output: >
      JSON con publicación oficial.
      Estructura:
      {
        "publicacion_oficial": {
          "proyecto_id": "string",
          "numero_ley": "Ley No. 1472",
          "titulo": "string",
          "fecha_promulgacion": "2025-03-20",
          "fecha_vigencia": "2025-03-21",
          "boletin_oficial": "BOL-2025-03-20-001",
          "estado": "PUBLICADA"
        }
      }
    herramientas: []
    depends_on:
      - "Evaluar_Veto_Promulgacion"

  # ========== TAREA 6: ANALIZAR CONSTITUCIONALIDAD DE FONDO ==========
  Analizar_Fondo_Constitucional:
    descripcion: >
      Análisis hermenéutico de constitucionalidad sustantiva.
      Aplicar interpretación constitucional, buscar precedentes,
      ponderar derechos en conflicto. Generar dictamen formal.
    agente: "Constitucion_Fondo"
    expected_output: >
      JSON con dictamen de fondo.
      Estructura:
      {
        "dictamen_fondo": {
          "proyecto_id": "string",
          "viabilidad_fondo": "VIABLE|VIABLE_CON_OBSERVACIONES|NO_VIABLE",
          "analisis_hermeneutico": {
            "principios_aplicables": ["string"],
            "precedentes_relevantes": ["Sentencia TC 1234/2022"],
            "conflictos_derechos": [
              {
                "derecho_1": "string",
                "derecho_2": "string",
                "ponderacion": "string"
              }
            ]
          },
          "recomendaciones": "string",
          "riesgo_constitucional": "BAJO|MEDIO|ALTO"
        }
      }
    herramientas:
      - "retrieve_jurisprudencia_tc"
      - "search_constitucion_precedentes"

  # ========== TAREAS FUNDACIONALES ==========
  Clasificar_Documento:
    descripcion: >
      Analizar el texto del documento para determinar la categoría institucional:
      AGENTE_REGISTRO_LEGISLATIVO, AGENTE_ATENCION_CIUDADANA o AGENTE_GESTION_CORRESPONDENCIA.
    agente: "Distribuidor"
    expected_output: "JSON con categoria y resumen"

  Asignar_Comision:
    descripcion: >
      Determinar la comisión y comité competente, prioridad y legisladores asignados.
    agente: "Comision_Legislativa"
    expected_output: "JSON con comision_principal y miembros"

  Auditar_Constitucionalidad:
    descripcion: >
      Control textual formal contra los artículos de la CPE 2009.
    agente: "Verificador_Constitucional"
    expected_output: "JSON con valido, contradicciones y articulos_consultados"

  Analizar_Consistencia:
    descripcion: >
      Auditoría semántica pgvector contra el corpus de leyes vigentes.
    agente: "Consistencia_Normativa"
    expected_output: "JSON con analisis, nivel_riesgo_global y hallazgos"
