# ============================================================================
# DEFINICIÓN DE TAREAS — SMA CONGRESO (CrewAI & YAML Architecture)
# 14 Tareas Especializadas del Proceso Legislativo Boliviano
# ============================================================================

tareas:
  # ==========================================================================
  # FASE 1: INGRESO, CLASIFICACIÓN Y ATENCIÓN
  # ==========================================================================

  Clasificar_Documento:
    descripcion: >
      Analizar el documento ingresado (texto, PDF o transcripción de voz).
      1. Verificar requisitos formales según Ley 1630 y Art. 156 CPE (iniciativa, exposición de motivos, articulado).
      2. Clasificar unívocamente en: AGENTE_REGISTRO_LEGISLATIVO, AGENTE_ATENCION_CIUDADANA o AGENTE_GESTION_CORRESPONDENCIA.
      3. Asignar materia temática (Constitucional, Económica, Social, Ambiental, Penal, etc.).
      4. Generar propuesta de número de expediente correlativo.
    agente: "Distribuidor"
    expected_output: >
      JSON con:
      {
        "categoria": "AGENTE_REGISTRO_LEGISLATIVO | AGENTE_ATENCION_CIUDADANA | AGENTE_GESTION_CORRESPONDENCIA",
        "confianza": 0.95,
        "materia": "string",
        "resumen_ejecutivo": "string",
        "cumple_requisitos_forma": true,
        "observaciones_forma": [],
        "prioridad_sugerida": "ALTA | MEDIA | BAJA"
      }
    herramientas: []

  Atender_Consulta_Ciudadana:
    descripcion: >
      Procesar consulta ciudadana recibida por texto o voz (STT).
      1. Detectar intención ciudadana (información sobre leyes, estado de un trámite o nueva petición).
      2. Formular respuesta clara, respetuosa e institucional.
      3. Derivar al agente respectivo si se trata de un trámite parlamentario formal.
    agente: "Interaccion_Ciudadana"
    expected_output: >
      JSON con:
      {
        "intencion_detectada": "CONSULTA_INFORMACION | ESTADO_TRAMITE | PRESENTACION_INICIATIVA | RECLAMO_QUEJA",
        "confianza_intencion": 0.92,
        "respuesta_ciudadana": "string",
        "requiere_derivacion": false,
        "agente_destino": null,
        "puntos_clave": ["string"]
      }
    herramientas: []

  # ==========================================================================
  # FASE 2: AUDITORÍA NORMATIVA Y TRABAJO EN COMISIÓN
  # ==========================================================================

 Auditar_Constitucionalidad:
  descripcion: >
    Auditoría formal y textual estricta contra la CPE 2009 (Arts. 1 al 410).
    1. Extraer cada artículo del proyecto de ley (identificando "Art. X", incisos y
       proposiciones normativas autónomas). Si el proyecto no está articulado,
       segmentar por párrafos numerados o por bloques temáticos y declararlo en
       fundamentacion_general.
    2. Cotejar de manera literal contra derechos fundamentales (Arts. 13-144),
       garantías (Arts. 115-124), estructura y competencias del Estado (Arts. 145-268)
       y régimen competencial autonómico (Arts. 297-304), bajo el principio de
       Supremacía Constitucional (Art. 410 CPE).
    3. Aplicar en orden las reglas de deducción R1→R7 del agente
       (prohibición vs. permiso; obligación vs. omisión; jerarquía normativa;
       competencia/ámbito; desarrollo/garantía; ponderación; sin tensión).
    4. Exigir cita literal de AMBOS textos (proyecto y CPE) antes de reportar
       cualquier contradicción. Sin cita literal verificable → NEUTRAL con
       verificado=false (candado anti-alucinación).
    5. Emitir semáforo de severidad: BLOQUEANTE (incompatibilidad insalvable con
       derecho fundamental, supremacía constitucional o núcleo de competencia
       exclusiva), GRAVE (conflicto competencial Arts. 297-304 o invasión de ámbito
       que exige reforma del artículo), LEVE (ambigüedad formal o defecto de técnica
       legislativa) o NINGUNA (sin tensión jurídica relevante).
    6. Cuando la tensión exija ponderar derechos o valores en conflicto, NO decidir:
       clasificar como REQUIERE_ANALISIS_DE_FONDO y remitir a revisión humana.
    7. Persistir el dictamen con trazabilidad completa: regla aplicada (R1-R7),
       tipo_conflicto, severidad, citas literales y estado de verificación.
    8. Ante fallo de tool o artículo no encontrado: registrar en
       fundamentacion_general y continuar; NUNCA inventar texto constitucional.

  agente: "Verificador_Constitucional"

  expected_output: >
    JSON ESTRICTO (sin markdown, sin texto adicional) con el siguiente contrato.
    Los campos marcados como (obligatorio) DEBEN estar siempre presentes.
    Los campos marcados como (aditivo) amplían el contrato y son retrocompatibles.

    {
      "valido": true | false,                                  // (obligatorio) true solo si num_contradicciones == 0
      "confianza": 0.0 a 1.0,                                  // (obligatorio) ver regla_confianza abajo
      "severidad_maxima": "ninguna" | "leve" | "grave" | "bloqueante",  // (obligatorio)
      "num_contradicciones": 0,                                // (obligatorio) entero >= 0
      "contradicciones": [                                     // (obligatorio) lista, puede ser vacía
        {
          "articulo_proyecto": "Art. X",                       // (obligatorio)
          "articulo_cpe": "Art. Y CPE",                        // (obligatorio)
          "texto_cpe_literal": "...",                          // (obligatorio) copia textual exacta
          "texto_proyecto_literal": "...",                     // (aditivo)    copia textual exacta
          "tipo_conflicto": "VULNERACION_DERECHO | INVASION_COMPETENCIAS | FORMA | SUPREMACIA_CONSTITUCIONAL",  // (obligatorio)
          "severidad": "leve" | "grave" | "bloqueante",        // (obligatorio)
          "regla_aplicada": "R1 | R2 | R3 | R4",               // (aditivo)    trazabilidad lógica
          "explicacion": "...",                                // (obligatorio) <=120 palabras, sin interpretación
          "verificado": true | false                           // (aditivo)    true solo si ambas citas son literales
        }
      ],
      "requieren_analisis_fondo": [                            // (aditivo)    casos R6 (no decididos)
        {
          "articulo_cpe": "Art. Z CPE",
          "razon": "...",
          "texto_cpe_literal": "..."
        }
      ],
      "articulos_a_favor": [                                   // (aditivo)    casos R5
        {
          "articulo_cpe": "Art. W CPE",
          "texto_cpe_literal": "...",
          "explicacion": "..."
        }
      ],
      "articulos_consultados": [                               // (aditivo)    trazabilidad de tools
        { "numero": "X", "titulo": "...", "extracto": "..." }
      ],
      "fundamentacion_general": "string"                       // (obligatorio) síntesis <=200 palabras
    }

    REGLAS DEL CONTRATO:
    - "valido" = true SI Y SOLO SI "num_contradicciones" == 0.
    - "severidad_maxima" = máximo de las severidades de "contradicciones"
      (bloqueante > grave > leve > ninguna). Si la lista está vacía → "ninguna".
    - "num_contradicciones" = len("contradicciones"). Debe coincidir exactamente.
    - Toda entrada de "contradicciones" DEBE tener "verificado"=true; si no,
      se excluye de la lista y se degrada a "NEUTRAL" (ver regla_confianza).
    - "confianza" se calcula así:
        base = 0.95
        penalizacion = 0.12 * num_contradicciones_verificadas
        bonus_si_todo_verificado = +0.03 si todas las contradicciones tienen verificado=true
        penalizacion_por_no_verificado = -0.10 por cada hallazgo con verificado=false
        confianza = max(0.55, min(0.98, base - penalizacion + bonus - penalizacion_por_no_verificado))
      Si no hay contradicciones y todos los artículos consultados fueron verificados → confianza >= 0.90.
      Si hubo fallos de tools o artículos no encontrados → confianza <= 0.80.
    - "fundamentacion_general" DEBE mencionar: (a) número de artículos consultados,
      (b) reglas R aplicadas, (c) si hubo casos R6 remitidos a revisión humana,
      (d) cualquier degradación por falta de cita literal.

  herramientas: []  # El agente usa sus tools internas declaradas en Verificador_Constitucional.tools_permitidas

  # ── Ampliaciones operativas (aditivas, no rompen el cargador de tareas) ────
  instrucciones_entrada:
    - "Aceptar como entrada: texto completo del proyecto, o lista de artículos ya segmentados."
    - "Si el proyecto excede el contexto del modelo, procesar por bloques de máximo 3000 caracteres, manteniendo continuidad de numeración de artículos."
    - "Si el proyecto no tiene articulado formal, segmentar por párrafos y declararlo en fundamentacion_general."
    - "Registrar en articulos_consultados TODOS los artículos CPE recuperados, incluso los NEUTRAL."

  criterios_aceptacion:
    - "Toda contradicción reportada tiene texto_cpe_literal y texto_proyecto_literal copiados textualmente."
    - "Toda contradicción reportada declara regla_aplicada (R1-R4) y tipo_conflicto."
    - "severidad_maxima es coherente con la lista de contradicciones."
    - "num_contradicciones == len(contradicciones)."
    - "valido es coherente con num_contradicciones."
    - "confianza respeta la fórmula de regla_confianza."
    - "fundamentacion_general sintetiza el dictamen sin introducir hechos no citados."

  politica_degradacion:
    sin_cita_literal: "NEUTRAL + verificado=false; excluir de contradicciones."
    tool_error: "Registrar en fundamentacion_general; continuar con los demás artículos; no inventar texto."
    articulo_cpe_no_encontrado: "Registrar en articulos_consultados con extracto='NO_ENCONTRADO'; continuar."
    proyecto_vacio: "Devolver valido=false, confianza=0.0, severidad_maxima='ninguna', num_contradicciones=0, contradicciones=[], fundamentacion_general='Proyecto vacío o ilegible'."
    caso_ambiguo: "REQUIERE_ANALISIS_DE_FONDO (no decidir; añadir a requieren_analisis_fondo)."

  metricas_salida:
    requiere_cita_literal: true
    requiere_regla_aplicada: true
    requiere_severidad: true
    requiere_tipo_conflicto: true
    max_contradicciones_reportadas: 20
    idioma: "es-BO"
    formato: "json_estricto"

  ejemplos_salida:
    valido_sin_hallazgos: >
      {
        "valido": true,
        "confianza": 0.95,
        "severidad_maxima": "ninguna",
        "num_contradicciones": 0,
        "contradicciones": [],
        "requieren_analisis_fondo": [],
        "articulos_a_favor": [
          { "articulo_cpe": "Art. 18 CPE", "texto_cpe_literal": "Todas las personas tienen derecho a la salud.", "explicacion": "El proyecto desarrolla el derecho a la salud (R5)." }
        ],
        "articulos_consultados": [
          { "numero": "18", "titulo": "Derecho a la salud", "extracto": "Todas las personas tienen derecho a la salud." }
        ],
        "fundamentacion_general": "Se consultaron 1 artículo CPE. No se detectaron contradicciones literales. Regla R5 aplicada (A_FAVOR)."
      }

    invalido_con_hallazgo: >
      {
        "valido": false,
        "confianza": 0.83,
        "severidad_maxima": "bloqueante",
        "num_contradicciones": 1,
        "contradicciones": [
          {
            "articulo_proyecto": "Art. 5",
            "articulo_cpe": "Art. 18 CPE",
            "texto_cpe_literal": "Todas las personas tienen derecho a la salud.",
            "texto_proyecto_literal": "Se excluye del sistema público de salud a las personas sin domicilio fijo.",
            "tipo_conflicto": "VULNERACION_DERECHO",
            "severidad": "bloqueante",
            "regla_aplicada": "R2",
            "explicacion": "La CPE garantiza el derecho a la salud sin condicionarlo; el proyecto excluye un grupo. Regla R2 (obligación vs. omisión).",
            "verificado": true
          }
        ],
        "requieren_analisis_fondo": [],
        "articulos_a_favor": [],
        "articulos_consultados": [
          { "numero": "18", "titulo": "Derecho a la salud", "extracto": "Todas las personas tienen derecho a la salud." }
        ],
        "fundamentacion_general": "Se consultó 1 artículo CPE. Se detectó 1 contradicción verificada con cita literal (R2). Severidad máxima: bloqueante."
      }

  Analizar_Consistencia:
    descripcion: >
      Auditoría semántica con pgvector sobre el corpus de leyes vigentes de Bolivia.
      1. Generar embeddings 2048d del articulado propuesto.
      2. Buscar antinomias, vacíos legales y derogaciones tácitas contra códigos y leyes orgánicas vigentes.
      3. Presentar cuadro comparativo de colisiones normativas detectadas.
    agente: "Consistencia_Normativa"
    expected_output: >
      JSON con:
      {
        "nivel_riesgo_global": "BAJO | MEDIO | ALTO | CRITICO",
        "hallazgos": [
          {
            "articulo_proyecto": "Art. X",
            "norma_vigente": "Ley N° XXXX",
            "articulo_vigente": "Art. Y",
            "tipo_relacion": "COLISION | DEROGACION_TACITA | REDUNDANCIA",
            "similitud_semantica": 0.85,
            "justificacion": "string",
            "sugerencia_redaccion": "string"
          }
        ],
        "resumen_consistencia": "string"
      }
    herramientas: []

  Evaluar_Viabilidad_Tecnica:
    descripcion: >
      Análisis técnico pericial y fáctico de la materia parlamentaria.
      1. Evaluar si la infraestructura y capacidad operativa existen en el país para aplicar la ley.
      2. Verificar compatibilidad con estándares técnicos internacionales (ISO, OIT, OMS).
      3. Cuantificar matriz de riesgos operacionales (probabilidad e impacto).
    agente: "Especialista_Tecnico"
    expected_output: >
      JSON con:
      {
        "materia_tecnica": "TECNOLOGIA | MEDIO_AMBIENTE | SALUD | INFRAESTRUCTURA",
        "viabilidad_tecnica": "VIABLE | VIABLE_CON_CONDICIONES | NO_VIABLE",
        "puntuacion_viabilidad": 8.5,
        "infraestructura_requerida": ["string"],
        "estandares_aplicables": ["ISO 27001"],
        "matriz_riesgos": [],
        "dictamen_tecnico_resumen": "string"
      }
    herramientas: []

  Planificar_Debate_Comision:
    descripcion: >
      Orquestar el trabajo legislativo en la Comisión especializada.
      1. Generar Orden del Día con asignación de tiempos de debate por punto.
      2. Determinar la lista de especialistas técnicos y autoridades a convocar a audiencias públicas.
      3. Estimar cronograma de tratamiento (plazo reglamentario de 15 a 30 días hábiles).
    agente: "Presidencia_Comision"
    expected_output: >
      JSON con:
      {
        "comision_nombre": "string",
        "orden_del_dia": [
          {"numero": 1, "punto": "string", "tiempo_estimado_minutos": 30, "responsable": "string"}
        ],
        "especialistas_convocados": ["string"],
        "cronograma_estimado_dias": 15,
        "plan_de_audiencias": "string",
        "instrucciones_a_secretaria": "string"
      }
    herramientas: []

  Analizar_Fondo_Constitucional:
    descripcion: >
      Análisis hermenéutico y de fondo jurídico constitucional.
      1. Ponderar valores supremos del Estado Plurinacional (Vivir Bien, descolonización, igualdad).
      2. Analizar sentencias y autos constitucionales vinculantes del Tribunal Constitucional Plurinacional (TCP).
      3. Aplicar test de proporcionalidad (idoneidad, necesidad y proporcionalidad en sentido estricto).
    agente: "Constitucion_Fondo"
    expected_output: >
      JSON con:
      {
        "viabilidad_fondo": "CONSTITUCIONAL | CONSTITUCIONAL_CON_CONDICION | INCONSTITUCIONAL_FONDO",
        "principios_fundamentales_analizados": ["string"],
        "precedentes_tcp_aplicables": ["SCP 0812/2012-R"],
        "test_proporcionalidad": {
          "fin_legitimo": true,
          "idoneidad": true,
          "necesidad": true,
          "proporcionalidad_estricta": "string"
        },
        "dictamen_fondo_detallado": "string",
        "enmiendas_de_fondo_sugeridas": ["string"]
      }
    herramientas: []

  Evaluar_Impacto_Presupuestario:
    descripcion: >
      Evaluación de sostenibilidad fiscal y cumplimiento de la Ley 1178 (SAFCO).
      1. Cuantificar el costo de implementación inicial y costo operativo anual en Bolivianos (Bs).
      2. Verificar si la iniciativa cuenta con fuente de financiamiento identificada en el TGN o créditos.
      3. Simular escenarios macroeconómicos: Optimista, Conservador y Estresado/Pesimista.
    agente: "Planificacion_Presupuesto"
    expected_output: >
      JSON con:
      {
        "viabilidad_fiscal": "SOSTENIBLE | CONDICIONADA_A_RECURSOS | INSOSTENIBLE_DEFICIT",
        "costo_implementacion_inicial_bs": 15000000.0,
        "costo_operativo_anual_bs": 2500000.0,
        "fuente_financiamiento_identificada": true,
        "escenarios": {
          "optimista": {"costo_neto": "string"},
          "conservador": {"costo_neto": "string"},
          "pesimista": {"costo_neto": "string"}
        },
        "alerta_presupuesto_tgn": "VERDE | AMARILLA | ROJA",
        "recomendacion_fiscal": "string"
      }
    herramientas: []

  Concentrar_Observaciones:
    descripcion: >
      Integrar observaciones de los agentes de análisis (Constitucionalidad y Consistencia Normativa,
      Especialista Técnico, Constitución Fondo y Presupuesto) en un expediente y dictamen unificado.
      Eliminar redundancias manteniendo trazabilidad estricta de la fuente, aplicar pensamiento
      analítico ampliado para generar resumen del proyecto y conclusiones técnico-jurídicas,
      y emitir un informe oficial formal en PDF con letra negra y certificación criptográfica.
    agente: "Concentrador"
    expected_output: >
      JSON con expediente consolidado, análisis ampliado, conclusiones y dictamen PDF:
      {
        "expediente_consolidado": {
          "resumen_ejecutivo": "string",
          "resumen_proyecto_detallado": "string",
          "sintesis_constitucional": "string",
          "sintesis_normativa": "string",
          "conclusiones_juridicas": "string",
          "recomendaciones_vinculantes": "string",
          "declaracion_metodologia": "string",
          "observaciones_integradas": [
            {
              "id": "OBS-001",
              "tipo": "CONSTITUCIONAL | CONSISTENCIA | TECNICO | FONDO | PRESUPUESTO",
              "fuente": "string",
              "cita_original": "string",
              "riesgo": "BAJO | MEDIO | ALTO | CRITICO",
              "articulo_afectado": "string"
            }
          ],
          "pdf_informe": {
            "filename": "string",
            "url_descarga": "string",
            "sha256": "string"
          },
          "estado_siguiente": "LISTO_PARA_DEBATE | BLOQUEADO_PARA_DEBATE"
        }
      }
    herramientas: []

  # ==========================================================================
  # FASE 3: PLENARIA Y PROCEDIMIENTO BICAMERAL
  # ==========================================================================

  Registrar_Debate:
    descripcion: >
      Capturar la estructura formal del debate legislativo conforme al Reglamento Camaral:
      verificar quórum de asistencia, registrar intervenciones de parlamentarios por bancada,
      mociones de sala y ejecutar el cómputo de la doble votación nominal:
      1. Votación En Grande (Mayoría Absoluta > 50% presentes o archivo del proyecto).
      2. Votación En Detalle (Aprobación artículo por artículo y enmiendas).
      Formalizar el acta oficial y certificar para el trámite bicameral.
    agente: "Secretario_Camara"
    expected_output: >
      JSON con acta estructurada del debate.
      Estructura:
      {
        "acta_debate": {
          "fecha": "YYYY-MM-DD",
          "sesion_numero": 14,
          "camara": "Cámara de Diputados | Cámara de Senadores",
          "tipo_sesion": "ORDINARIA | EXTRAORDINARIA",
          "quorum_legal": {
            "total_miembros": 130,
            "presentes": 110,
            "quorum_verificado": true
          },
          "intervenciones": [
            {
              "orden": 1,
              "legislador": "string",
              "partido": "string",
              "postura": "A_FAVOR | EN_CONTRA | OBSERVACION",
              "contenido": "string",
              "timestamp": "HH:MM"
            }
          ],
          "mociones": [
            {
              "tipo": "PREVIA | ORDEN | APLAZAMIENTO",
              "proponente": "string",
              "resultado": "APROBADA | RECHAZADA"
            }
          ],
          "votacion_en_grande": {
            "total_votantes": 110,
            "favor": 75,
            "contra": 30,
            "abstenciones": 5,
            "mayoria_absoluta_requerida": 56,
            "resultado": "APROBADO | RECHAZADO"
          },
          "votacion_en_detalle": [
            {
              "articulo": 1,
              "favor": 80,
              "contra": 25,
              "abstenciones": 5,
              "resultado": "APROBADO | MODIFICADO | SUPRIMIDO"
            }
          ],
          "acuerdos": ["string"],
          "resultado_final": "APROBADO_EN_GRANDE_Y_DETALLE | RECHAZADO_EN_ORIGEN_ARCHIVADO",
          "estado_siguiente": "EN_TRAMITE_BICAMERAL | ARCHIVADO_LEGISLATURA"
        }
      }
    herramientas: []

  Gestionar_Bicameral:
    descripcion: >
      Gestionar trámite bicameral recibiendo el acta certificada de la Cámara de Origen.
      Comparar versiones original y retornada, clasificar enmiendas como MAYORES o MENORES,
      declarar la Sanción de la Ley o convocar a Sesión Plenaria Conjunta de la ALP.
    agente: "Bicameral"
    expected_output: >
      JSON con decisión bicameral y estado de sanción.
      Estructura:
      {
        "ciclo_bicameral": {
          "proyecto_id": "string",
          "version_original": {"articulos": []},
          "version_retornada": {"articulos": []},
          "cambios_detectados": [
            {
              "tipo": "MODIFICACION|ELIMINACION|ADICION",
              "articulo": 5,
              "descripcion": "string"
            }
          ],
          "clasificacion_cambios": "MAYORES|MENORES",
          "resolucion": "SANCION_DIRECTA | CONVOCATORIA_PLENO_ALP",
          "estado_siguiente": "LISTO_PARA_VETO_PROMULGACION"
        }
      }
    herramientas: []
    depends_on:
      - "Registrar_Debate"

  # ========== TAREA 4: EVALUAR VETO/PROMULGACIÓN (HUMAN-IN-THE-LOOP) ==========
  Evaluar_Veto_Promulgacion:
    descripcion: >
      Analizar el expediente del proyecto sancionado y emitir dictamen técnico-jurídico con recomendaciones
      de Promulgación o Veto conforme al Art. 164 de la CPE. Habilitar la confirmación u orden de decisión
      ejecutiva en manos del operador humano (Human-in-the-Loop).
    agente: "Veto_Promulgacion"
    expected_output: >
      JSON con dictamen técnico de asesoría ejecutiva, pliego de observaciones y opciones de acción para el operador.
      Estructura:
      {
        "evaluacion_veto": {
          "proyecto_id": "string",
          "decision": "PROMULGAR | VETAR_TOTAL | VETAR_PARCIAL",
          "modo_control": "HUMAN_IN_THE_LOOP",
          "plazo_constitucional_dias": 10,
