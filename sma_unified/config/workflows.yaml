version: '3.0'
workflows:
  Pipeline_Legislativo_Completo:
    nombre: Pipeline Legislativo Completo
    descripcion: Flujo desde interacción ciudadana e ingreso hasta publicación y fiscalización con controles
      humanos.
    etapas:
      Fase_1_Ingreso_Interaccion:
        nombre: 'Fase 1: Interacción ciudadana e ingreso'
        tareas:
        - Atender_Consulta_Ciudadana
        - Clasificar_Documento
        orden:
        - Interaccion_Ciudadana
        - Distribuidor
        punto_control: true
      Fase_2_Distribucion_y_Revision:
        nombre: 'Fase 2: Distribución y revisión especializada'
        tareas:
        - Distribuir_Analisis_Especializado
        - Auditar_Constitucionalidad
        - Analizar_Consistencia
        - Evaluar_Viabilidad_Tecnica
        - Planificar_Debate_Comision
        - Analizar_Fondo_Constitucional
        - Evaluar_Impacto_Presupuestario
        - Concentrar_Observaciones
        - Coordinar_Tarea_Comodin
        agente_control: Distribuidor
        paralelo: true
        requiere_fuentes_verificables: true
      Fase_3_Actas_y_Bicameral:
        nombre: 'Fase 3: Secretaría de actas y trámite bicameral'
        tareas:
        - Registrar_Debate
        - Emitir_Documentos_Oficiales
        - Gestionar_Bicameral
        punto_control: true
        control_aprobacion:
          requiere_aprobacion_humana: true
          roles_permitidos:
          - Diputado
          - Senador
          - Admin
          - Administrador
          requiere_verificacion_normativa: true
          requiere_motivo_revision: true
          estados:
          - PENDIENTE_APROBACION_HUMANA
          - APROBADO_REVISION_HUMANA
          - EN_REVISION
      Fase_4_Veto_Promulgacion_y_Publicacion:
        nombre: 'Fase 4: Veto, promulgación y publicación'
        tareas:
        - Evaluar_Veto_Promulgacion
        - Publicar_Ley_Oficial
        punto_control: true
        depende_de:
        - Fase_3_Actas_y_Bicameral
        decision_ejecutiva_humana: true
      Fase_5_Difusion_y_Fiscalizacion:
        nombre: 'Fase 5: Difusión ciudadana y fiscalización'
        tareas:
        - Generar_Difusion_Ciudadana
        - Monitorear_Fiscalizacion
        - Notificar_Comision
        depende_de:
        - Fase_4_Veto_Promulgacion_y_Publicacion
    tiempo_estimado_minutos: 90
  Pipeline_Auditoria_Rapida:
    nombre: Auditoría rápida
    descripcion: Clasificación, distribución y revisión jurídica resumida.
    etapas:
      Etapa_1:
        tareas:
        - Clasificar_Documento
        - Distribuir_Analisis_Especializado
      Etapa_2:
        tareas:
        - Auditar_Constitucionalidad
        - Analizar_Consistencia
        paralelo: true
      Etapa_3:
        tareas:
        - Concentrar_Observaciones
        punto_control: true
