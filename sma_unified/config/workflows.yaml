# ============================================================================
# DEFINICIÓN DE WORKFLOWS — SMA CONGRESO (CrewAI Orchestration)
# Proceso Legislativo Plurinacional de Bolivia — 5 Fases Canónicas
# ============================================================================

workflows:
  # ========== WORKFLOW INTEGRAL COMPLETO (5 FASES) ==========
  Pipeline_Legislativo_Completo:
    nombre: "Pipeline Legislativo Completo de Bolivia"
    descripcion: "Flujo integral desde la Mesa de Entradas hasta la Difusión Ciudadana y Fiscalización Posterior"

    etapas:
      Fase_1_Ingreso_Admision:
        nombre: "Fase 1: Ingreso, Admisión y Atención"
        tareas:
          - Clasificar_Documento
          - Atender_Consulta_Ciudadana
        punto_control: true
        descripcion: "Recepción de iniciativa legislativa, validación formal y asignación de expediente"

      Fase_2_Comision_Dictamenes:
        nombre: "Fase 2: Trabajo en Comisión y Dictámenes Especializados"
        tareas:
          - Auditar_Constitucionalidad
          - Analizar_Consistencia
          - Evaluar_Viabilidad_Tecnica
          - Planificar_Debate_Comision
          - Analizar_Fondo_Constitucional
          - Evaluar_Impacto_Presupuestario
          - Concentrar_Observaciones
        paralelo: true
        dependencias:
          - Fase_1_Ingreso_Admision
        descripcion: "Auditoría legal (forma y fondo), técnica, presupuestaria y consolidación de expediente"

      Fase_3_Plenaria_Bicameral:
        nombre: "Fase 3: Debate en Plenaria y Trámite Bicameral"
        tareas:
          - Registrar_Debate
          - Gestionar_Bicameral
        punto_control: true
        descripcion: "Debate en Cámara de Origen (verificación de quórum, oradores, votación en grande y detalle) y coordinación bicameral de enmiendas"
        dependencias:
          - Fase_2_Comision_Dictamenes

      Fase_4_Ejecutivo_Promulgacion:
        nombre: "Fase 4: Evaluación de Veto/Promulgación y Publicación Oficial"
        tareas:
          - Evaluar_Veto_Promulgacion
          - Publicar_Ley_Oficial
        punto_control: true
        descripcion: "Asesoría técnica ejecutiva (10 días) con control humano de decisión (Human-in-the-Loop) y publicación oficial en Gaceta"
        dependencias:
          - Fase_3_Plenaria_Bicameral

      Fase_5_Ciudadania_Fiscalizacion:
        nombre: "Fase 5: Difusión en Lenguaje Claro y Control Posterior"
        tareas:
          - Generar_Difusion_Ciudadana
          - Monitorear_Fiscalizacion
          - Notificar_Comision
        descripcion: "Explicación pedagógica ciudadana, monitoreo de decretos reglamentarios y auditoría de ejecución presupuestaria"
        dependencias:
          - Fase_4_Ejecutivo_Promulgacion

    tiempo_estimado_minutos: 90

  # ========== WORKFLOW RÁPIDO DE AUDITORÍA Y FILTRO INICIAL ==========
  Pipeline_Auditoria_Rapida:
    nombre: "Filtro Rápido de Admisibilidad y Coherencia"
    descripcion: "Verificación de forma, constitucionalidad literal y antinomias para admisión inmediata"

    etapas:
      Etapa_Clasificacion:
        nombre: "Clasificación"
        tareas:
          - Clasificar_Documento
        punto_control: false

      Etapa_Auditoria:
        nombre: "Auditoría Legal Inmediata"
        tareas:
          - Auditar_Constitucionalidad
          - Analizar_Consistencia
        paralelo: true

      Etapa_Informe:
        nombre: "Consolidación de Admisibilidad"
        tareas:
          - Concentrar_Observaciones
        punto_control: true

    tiempo_estimado_minutos: 10
