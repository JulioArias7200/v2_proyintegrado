      :1,\"legislador\":\"Dip. X\",\"partido\":\"MAS-IPSP\",\n         \"postura\":\"A_FAVOR\",\"contenido\":\"\
      ...\",\"timestamp\":\"10:15\"}\n      ],\n      \"mociones\":[\n        {\"tipo\":\"ORDEN\",\"proponente\"\
      :\"Dip. Y\",\"resultado\":\"APROBADA\"}\n      ],\n      \"votacion_en_grande\":{\"total_votantes\":110,\"\
      favor\":75,\"contra\":30,\n        \"abstenciones\":5,\"mayoria_absoluta_requerida\":56,\n        \"resultado\"\
      :\"APROBADO\"},\n      \"votacion_en_detalle\":[\n        {\"articulo\":1,\"favor\":80,\"contra\":25,\"abstenciones\"\
      :5,\n         \"resultado\":\"APROBADO\"}\n      ],\n      \"resultado_final\":\"APROBADO_EN_GRANDE_Y_DETALLE\"\
      ,\n      \"estado_siguiente\":\"EN_TRAMITE_BICAMERAL\"\n    }\n  }\n\n[FORMATO]\nJSON estricto según contrato,\
      \ es-BO.\n\n[NEGATIVE PROMPTING — 4 prohibiciones]\n- PROHIBIDO omitir intervenciones o alterar el sentido\
      \ del voto.\n- PROHIBIDO emitir acta si los totales no cuadran.\n- PROHIBIDO confundir mayoría absoluta con\
      \ mayoría simple.\n- PROHIBIDO modificar el texto aprobado al transcribirlo.\n"
    configuracion_llm:
