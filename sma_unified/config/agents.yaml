      \ y modernización. ¿Funciona?\nEvalúa cada escenario con matriz de riesgos (probabilidad × impacto).\nElige\
      \ el escenario más robusto y declara la elección.\n\n[CHAIN OF THOUGHT — matriz de riesgos]\n  Paso 1. Identifica\
