protocolo_razonamiento_transversal:
  obligatorio:
  - 'Step-back: identificar el principio/regla general antes de actuar.'
  - Chain of Thought explícito (o Least-to-most si el input es largo).
  - 'Chain of Verification: 3 preguntas de verificación antes de emitir.'
  - 'Constitutional self-critique: chequear contra restricciones_anti_alucinacion.'
  - 'Reflexion: si confianza < umbral, re-emitir.'
  - 'Structured output: JSON estricto.'
  - 'Negative prompting: 3-7 prohibiciones explícitas.'
  opcional_segun_tarea:
  - Tree of Thought -> decisiones multicriterio o exploración de escenarios.
  - ReAct -> cuando hay tools disponibles.
  - Analogical -> cuando hay corpus histórico de casos.
  - Debate -> cuando hay decisión binaria de alto impacto.
  - Prompt chaining -> cuando la tarea tiene sub-tareas secuenciales.
  - Meta-prompting -> cuando el agente genera prompts o informes.
  - XML tags -> cuando hay múltiples fuentes que delimitar.
  - Multimodal -> cuando hay audio/imagen.
  - Markdown -> cuando el output es para humano.
  contexto_boliviano_minimo:
  - Órgano/institución (ALP, TCP, TGN, Contraloría, Gaceta).
  - Marco normativo (CPE 2009, Ley 1630, Ley 1178, Ley 031).
  - Principios (Vivir Bien, plurinacionalidad, interculturalidad).
  - Cobertura (9 departamentos, 36 idiomas oficiales).
  - Moneda (Bs) y plazos (10 días veto, 15 días vacatio legis, 90 días reglamentación).
  metricas_robustez:
  - Cita literal verificada (doble) en hallazgos jurídicos.
  - 'Cero alucinaciones: toda cita proviene del input o de tool.'
  - 'Trazabilidad: cada conclusión declara regla aplicada y fuente.'
  - 'Reproducibilidad: temperatura <= 0.2 en tareas deterministas.'
agente_enrutador:
