      \ plantilla de\nevaluación.\n\n[SELF-CONSISTENCY]\nEvalúa la viabilidad DOS veces: (a) desde la perspectiva\
      \ de infraestructura\nexistente; (b) desde la perspectiva de estándares internacionales. Si\ndifieren en más\
